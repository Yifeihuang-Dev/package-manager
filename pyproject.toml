[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "package-manager"
version = "0.1.0"
description = "pkm — a personal vendoring-style Python package manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
pkm = "package_manager.cli:main"

[tool.setuptools]
packages = ["package_manager"]
